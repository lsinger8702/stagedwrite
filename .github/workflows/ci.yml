name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo
      - run: npm run demo:registry
      - run: npm run demo:graph
      - run: npm run demo:preflight
      - run: npm run demo:execution
      - run: npm run demo:dependencies
      - run: npm run demo:manual
      - run: npm run demo:continuation
      - run: npm run demo:stop
      - run: npm run demo:storage
      - run: npm run demo:durable
      - run: npm run demo:recovery
      - run: npm run demo:import
