name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node dist/examples/agent-demo.js
      - run: node dist/examples/repair-demo.js
      - run: npm ci --prefix integrations/dsh --ignore-scripts
      - run: npm test --prefix integrations/dsh
      - run: npm run test:stripe
      - run: npm run verify:update
      - run: npm run verify:walkthrough
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-raw
          path: dist/walkthrough-raw.json
          if-no-files-found: warn
      - run: npm run verify:package
