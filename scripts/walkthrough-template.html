<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StagedWrite · 一次真实的执行记录</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--paper:#fff;--ink:#18232d;--muted:#697580;--line:#dce3e9;--accent:#147567;--soft:#e8f3ef;--red:#b84438;--redbg:#fff1ed;--blue:#356da2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:14px;line-height:1.65}button,a,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #88bbf0;outline-offset:3px}button{border:1px solid var(--line);background:white;color:inherit;border-radius:7px;padding:8px 13px}button:hover{background:var(--soft)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}a{color:var(--accent)}header{height:72px;padding:0 28px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:5}.brand{font-size:21px;letter-spacing:-.7px;font-weight:750}.brand span{color:var(--accent)}.brand small{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:500;margin-left:18px}.head-right{display:flex;gap:10px;align-items:center}.badge{display:inline-block;border-radius:5px;padding:3px 9px;font-size:12px;font-weight:650;background:var(--soft);color:var(--accent)}.badge.error,.badge.unknown{background:var(--redbg);color:var(--red)}.badge.neutral{background:#edf1f5;color:#52677d}.layout{display:grid;grid-template-columns:255px minmax(0,1fr);max-width:1580px;margin:auto}.sidebar{position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto;border-right:1px solid var(--line);padding:26px 15px;background:#f9fafb}.nav-label{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);margin:15px 13px 8px}.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:10px 11px;margin:2px 0;border-radius:7px}.nav-item.active{background:#e2eee9;color:#105a50}.nav-num{font-family:monospace;color:#85919a;font-size:12px;min-width:21px}.nav-copy{flex:1;min-width:0}.nav-copy strong{font-size:13px;display:block}.nav-copy small{display:block;font-size:11px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:100%;background:#a8b4be;flex-shrink:0}.dot.passed,.dot.published{background:#2c8e6d}.dot.blocked,.dot.unknown{background:#d47b49}.footnote{font-size:11px;color:var(--muted);padding:20px 12px}.main{min-width:0;padding:32px 38px 70px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:1.4px;font-weight:700}h1{font-size:29px;letter-spacing:-.8px;line-height:1.25;margin:9px 0 12px}h2{font-size:18px;margin:28px 0 14px;letter-spacing:-.2px}h3{font-size:14px;margin:0}.lead{color:var(--muted);max-width:850px;margin:0 0 24px}.meta{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 12px}.section-head h2{margin:0}.facts{display:flex;flex-wrap:wrap;gap:18px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0}.facts span{color:var(--muted);font-size:12px}.facts b{font-size:18px;color:var(--ink);margin-right:5px}.graph{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin:15px 0 22px}.node{border:1px solid var(--line);border-radius:9px;background:white;padding:16px 19px;min-width:0}.node.project{grid-column:1 / -1;width:min(100%,500px);justify-self:center}.node-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}.node-id{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin:4px 0 10px}.fields{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:5px 15px;font-size:12px}.field-key{color:var(--muted);overflow-wrap:anywhere}.field-val{text-align:right;overflow-wrap:anywhere}.field-val.bad{color:var(--red);font-weight:600}.branches{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;color:var(--muted);text-align:center;font:11px ui-monospace,monospace;padding:10px 0}.issue{background:white;border:1px solid var(--line);border-left:3px solid #d77c58;border-radius:6px;padding:17px 20px;margin:10px 0}.issue-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.issue-code{font:11px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.issue p{margin:10px 0}.path{font:11px ui-monospace,SFMono-Regular,monospace;background:#f0f3f6;border-radius:3px;padding:4px 6px;overflow-wrap:anywhere;display:inline-block}.hint{font-size:12px;color:var(--muted)}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.choice{background:var(--soft);border-radius:4px;padding:5px 9px;font-size:12px}.user-intent{padding:18px 20px;background:#edf3fb;border-radius:8px;color:#304d6c;font-size:13px}.io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;align-items:start}.code-box{background:#14222d;border-radius:8px;color:#d6e3eb;min-width:0;overflow:hidden}.code-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #32414d;font-size:12px;color:#a9bac8}.code-head button{padding:3px 9px;font-size:11px;background:transparent;color:#cbdbe8;border-color:#485a69}.code-head button:hover{background:#2c414e}pre{font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0;padding:17px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:580px;overflow:auto;tab-size:2}.code-box.inline pre{max-height:340px}details{margin:13px 0;border:1px solid var(--line);border-radius:7px;background:white}summary{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:600}details .code-box{border-radius:0 0 6px 6px}.empty{padding:20px;color:var(--muted);border:1px dashed #bbc8d0;border-radius:8px}.run-steps{display:grid;gap:8px;margin:18px 0}.run-step{display:grid;grid-template-columns:90px minmax(95px,1fr) minmax(130px,2fr);align-items:center;gap:12px;background:white;border:1px solid var(--line);border-radius:7px;padding:13px 15px}.run-step code{font-size:11px;overflow-wrap:anywhere}.run-step small{color:var(--muted);font-size:11px}.method{font:13px ui-monospace,monospace;color:var(--blue);padding:10px 0;overflow-wrap:anywhere}.page-actions{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}.evidence{font-size:12px;padding:14px 17px;background:#eaf1ef;border-radius:7px;margin:20px 0;color:#3c6259}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}td code{font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#163b33;color:white;border-radius:8px;padding:9px 20px;z-index:50}.source-line{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}.source-line code{font-size:11px;overflow-wrap:anywhere}.audit{padding:16px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px;margin-top:30px}noscript{display:block;padding:20px}
@media(min-width:1450px){.main{padding:38px 48px}}@media(max-width:980px){.layout{grid-template-columns:200px minmax(0,1fr)}.main{padding:24px 23px}.io{grid-template-columns:1fr}.sidebar{padding:17px 9px}.brand small{display:none}}@media(max-width:680px){header{height:auto;min-height:65px;padding:12px 16px;flex-wrap:wrap;position:relative}.brand{font-size:19px}.head-right .badge{display:none}.layout{display:block}.sidebar{position:relative;top:0;height:auto;max-height:190px;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:10px}.nav-label,.footnote{display:none}.nav-item{width:auto;flex:1 0 140px;padding:7px}.nav-copy small{display:none}.main{padding:22px 16px}h1{font-size:25px}.graph{grid-template-columns:1fr;gap:12px}.node.project{grid-column:auto;width:100%}.branches{display:none}.run-step{grid-template-columns:75px 1fr}.run-step>div:last-child{grid-column:1/-1}pre{font-size:11px}.fields{font-size:12px}.facts{gap:12px}}@media print{.sidebar,.head-right,button,.page-actions{display:none}header{position:static}.layout{display:block}.main{padding:0}pre{max-height:none}.code-box{break-inside:avoid}.graph{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="brand">staged<span>write</span><small>EXECUTION NOTEBOOK</small></div><div class="head-right"><span class="badge">真实代码 · Mock 远端</span><button id="download">下载原始记录</button></div></header>
<div class="layout"><nav class="sidebar" id="nav" aria-label="实际调用步骤"></nav><main class="main" id="main" aria-live="polite"></main></div>
<noscript>请启用 JavaScript 查看嵌入的执行记录。旁边的 publish-resume-trace.json 包含完整数据。</noscript>
<script>
'use strict';
const bundle=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__BUNDLE__'),c=>c.charCodeAt(0))));
const trace=bundle.trace, steps=trace.steps;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=v=>JSON.stringify(v,null,2);
const blocked=steps.find(s=>s.method==='preflight'&&s.output.status==='blocked').output;
const passed=steps.find(s=>s.method==='preflight'&&s.output.status==='passed').output;
const status=s=>s.output?.status??s.output?.state??'';
const labels=steps.map(s=>s.note);
let selected='case';const codeValues=new Map();let codeId=0;
function badge(v){return `<span class="badge ${v==='blocked'||v==='incomplete'||v==='error'?'error':v==='unknown'?'unknown':v==='passed'||v==='published'?'':'neutral'}">${esc(v||'returned')}</span>`}
function codeBox(title,v){const id='code-'+codeId++;codeValues.set(id,typeof v==='string'?v:json(v));return `<div class="code-box"><div class="code-head"><span>${esc(title)}</span><button type="button" data-copy="${id}">复制</button></div><pre id="${id}">${esc(codeValues.get(id))}</pre></div>`}
function nav(){document.getElementById('nav').innerHTML=`<div class="nav-label">先看全貌</div><button class="nav-item ${selected==='case'?'active':''}" data-select="case"><span class="nav-num">◎</span><span class="nav-copy"><strong>有问题的 Draft</strong><small>图、诊断、用户意图与 OP</small></span></button><button class="nav-item ${selected==='registration'?'active':''}" data-select="registration"><span class="nav-num">{ }</span><span class="nav-copy"><strong>注册 schema / 规则</strong><small>完整 schema 与实际源码</small></span></button><div class="nav-label">逐步输入 / 输出</div>${steps.map((s,i)=>`<button class="nav-item ${selected===i?'active':''}" data-select="${i}" ${selected===i?'aria-current="step"':''}><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span class="nav-copy"><strong>${esc(s.method)}</strong><small>${esc(labels[i]||s.method)}</small></span><span class="dot ${esc(status(s))}"></span></button>`).join('')}<div class="footnote">点击只切换已记录的数据，不发送新请求。<br>全部数据已内嵌，可离线查看。</div>`}
const fieldNames={name:'名称',capacityHours:'容量 / 小时',deadlineDay:'项目截止日',estimateHours:'工时 / 小时',dueDay:'任务完成日',priority:'优先级',owner:'负责人'};
function graph(draft,diagnostics=[]){if(draft?.graph){draft={...draft.graph,nodes:Object.fromEntries(Object.entries(draft.graph.nodes).map(([id,n])=>[id,{...n,fields:Object.fromEntries(Object.entries(draft.fieldIntents[id]??{}).map(([p,f])=>[p.slice(1).replaceAll('~1','/').replaceAll('~0','~'),f.kind==='set'?{kind:'value',value:f.value}:{kind:'clear'}]))}]))};}if(!draft||!Object.keys(draft.nodes).length)return '<div class="empty">当前快照没有节点。</div>';const problems=new Set(diagnostics.map(d=>d.path));const nodes=Object.values(draft.nodes);const render=n=>`<article class="node ${n.nodeType==='project'?'project':''}"><div class="node-title">${esc(n.fields.name?.value??n.id)}<span class="badge neutral">${esc(n.nodeType)}</span></div><div class="node-id">${esc(n.id)}</div><div class="fields">${Object.entries(n.fields).map(([k,f])=>`<span class="field-key">${esc(fieldNames[k]||k)}</span><span class="field-val ${problems.has('/nodes/'+n.id+'/fields/'+k)?'bad':''}">${f.kind==='value'?esc(f.value===null?'null（显式值）':f.value):f.kind==='clear'?'clear · 明确清空':'undeclared · 未声明'}</span>`).join('')}</div></article>`;const project=nodes.filter(n=>n.nodeType==='project');const tasks=nodes.filter(n=>n.nodeType!=='project');return `<div class="graph">${project.map(render).join('')}<div class="branches">${Object.values(draft.edges).map(e=>`<span>↓ ${esc(e.relationType)} · ${esc(e.from)} → ${esc(e.to)}</span>`).join('')}</div>${tasks.map(render).join('')}</div>`}
function candidateCard(c,excluded=false){return `<div class="issue" style="border-left-color:${excluded?'#a0a7ad':'#147567'}"><h3>${esc(c.label??c.value)} <span class="path">${esc(c.value===null?'null':c.value)}</span></h3>${c.message?`<p>${esc(c.message)}</p>`:''}${c.metadata?codeBox('候选消歧信息',c.metadata):''}${!excluded&&c.repairOps?`<p class="hint">仅在选择此候选时考虑这一批 OP；预检没有执行它。</p>${codeBox('候选附带的 repairOps',c.repairOps)}`:''}</div>`}
function issues(list){return list.length?list.map((d,i)=>`<article class="issue"><div class="issue-top"><h3>${i+1}. ${esc(d.code)}</h3>${badge(d.severity)}</div><p>${esc(d.message)}</p><span class="path">${esc(d.path)}</span>${d.hint?`<p class="hint">建议方向：${esc(d.hint)}</p>`:''}${d.stage?`<p class="hint">阶段：${esc(d.stage)}</p>`:''}${d.retryable!==undefined?`<p class="hint">可建议重跑预检：${d.retryable?'是':'否'}${d.retryAfterSeconds!==undefined?' · 建议间隔 '+esc(d.retryAfterSeconds)+' 秒':''}；不会自动重试。</p>`:''}${d.metadata?`<details><summary>当前问题的结构化事实</summary>${codeBox('metadata',d.metadata)}</details>`:''}${d.candidates?.length?`<h2>可选值与候选编辑</h2>${d.candidates.map(c=>candidateCard(c)).join('')}`:''}${d.excludedCandidates?.length?`<details><summary>已排除的值 · 仅解释为何不可选</summary>${d.excludedCandidates.map(c=>candidateCard(c,true)).join('')}</details>`:''}${d.constraintIds?.length?`<p class="hint">规则声明采用的约束：${d.constraintIds.map(esc).join(' · ')}</p>`:''}${d.repairs?.length?`<h2>其他候选修复方案</h2><p class="hint">各方案相互独立，不能把它们全部拼接执行。调用方可以采用、修改或拒绝。</p>${d.repairs.map(repair=>`<details open><summary>${esc(repair.id??'候选方案')} · ${esc(repair.message)}</summary>${codeBox('这一方案的原子 OP 数组',repair.ops)}</details>`).join('')}`:''}${d.related?.length?`<div class="hint">关联位置：${d.related.map(p=>`<span class="path">${esc(p)}</span>`).join(' ')}</div>`:''}</article>`).join(''):'<div class="evidence">diagnostics = [] · 本次注册的规则和内建检查全部通过。</div>'}

function audit(){return `<div class="audit">记录时间 ${esc(trace.recordedAt)} · ${esc(trace.runtime)}<br>数据来自 npm run demo:publish-resume -- --write-report 的实际运行与示例内断言。使用 SQLite；远端为进程内 Mock，没有 HTTP 或 LLM 调用。publish 与 resume 使用同一正常运行的引擎，没有重启或 recover。<br>原始 trace SHA-256：<code>${esc(bundle.traceSha256)}</code></div>`}
function casePage(){return `<div class="eyebrow">一份填好内容、故意违反规则的工作图</div><h1>先看哪里出了问题</h1><p class="lead">注册 2 种节点、contains 关系与 3 条业务规则。初始意图结构合法，所以 create 保存成功；业务冲突由 preflight 实际检查出来。连续两次改名后 reset 恢复初始值，也已在下方调用中验证。</p><div class="facts"><span><b>3</b>已有节点</span><span><b>2</b>显式关系</span><span><b>${blocked.diagnostics.length}</b>真实命中的诊断</span><span>完整诊断 ${badge(blocked.status)}</span></div>${graph(blocked.preview,blocked.diagnostics)}<div class="section-head"><h2>Preflight 返回的具体问题</h2><button data-select="${steps.findIndex(s=>s.output.status==='blocked')}">完整输入 / 输出 →</button></div>${issues(blocked.diagnostics)}<h2>调用方如何决定 OP</h2><div class="user-intent"><b>本例假设的用户意图</b><br>${esc(trace.userIntent)}</div><p class="hint">规则已提供候选值和候选 OP。下面是示例调用方按用户意图选定的最终 OP：拒绝扩大容量，缩减任务工时，选择提前日期与林负责。没有真实调用大模型。</p>${codeBox('实际传给 edit 的 OP',trace.chosenOps)}<div class="evidence">应用 4 个 OP 后再次 preflight → ${badge(passed.status)}，diagnostics = []。随后才允许 publish。</div><h2>异步检查也已实际运行</h2><p>${esc(trace.asyncScenario)}</p><button data-select="${steps.findIndex(s=>s.output.status==='pending')}">查看 pending 的完整输入输出 →</button><h2>Publish 诊断也进入修复闭环</h2><p>${esc(trace.executionRepairIntent)}</p><button data-select="${steps.findIndex(s=>s.method==='publish')}">查看远端拒绝和候选 repairOps →</button><h2>本次远端效果的变化</h2><div class="table-wrap"><table><thead><tr><th>调用</th><th>返回</th><th>本步远端动作</th><th>资源总数</th></tr></thead><tbody>${steps.map((s,i)=>({s,i})).filter(({s})=>['publish','resume'].includes(s.method)).map(({s,i})=>`<tr><td><button data-select="${i}">${esc(s.method)}${s.output?.id?' · '+esc(s.output.id):''}</button></td><td>${badge(status(s))}</td><td>${s.remoteCalls.length?s.remoteCalls.map(c=>esc(c.method)+'('+esc(c.input.step.id)+')').join('<br>'):'无'}</td><td>${s.effectCount}</td></tr>`).join('')}</tbody></table></div><div class="page-actions"><button data-select="registration">查看注册源码</button><button class="primary" data-select="0">从 create 开始逐步看 →</button></div>${audit()}`}
function registrationPage(){return `<div class="eyebrow">实际装配进 createStagedWrite 的配置</div><h1>Schema、规则与发送函数</h1><p class="lead">业务模型与规则都是虚构的，但以下配置确实由本次示例注册并运行。函数不能存为 JSON，因此这里保留其实际源码，原始记录中也保存了规则函数文本。</p>${codeBox('引擎装配 · examples/publish-and-resume.ts','createStagedWrite({\n  definitions: [definition],\n  rules,\n  asyncRules,\n  ...backend,\n  executors: [executor]\n})')}<h2>Schema：project / task / contains</h2>${codeBox('实际注册的 definition',trace.registration.definition)}<h2>异步规则 · 单次查询</h2><p class="hint">${esc(trace.asyncScenario)}</p>${(trace.registration.asyncRules??[]).map(rule=>codeBox(rule.id,rule.implementation)).join('')}<h2>3 条同步规则</h2>${trace.registration.rules.map(rule=>`<details><summary>${esc(rule.id)} @ ${esc(rule.version)} · ${esc(rule.type)} / ${esc(rule.typeVersion)}</summary>${codeBox('实际运行的规则函数',rule.implementation)}</details>`).join('')}<details><summary>完整 fixture 源码：schema、规则、初始图、用户意图、修复 OP</summary>${codeBox(bundle.sources.fixture.path,bundle.sources.fixture.text)}</details><details><summary>完整执行源码：plan 映射、Mock apply / reconcile、每一步断言</summary>${codeBox(bundle.sources.example.path,bundle.sources.example.text)}</details><div class="page-actions"><button data-select="case">← 看完整现场</button><button class="primary" data-select="0">查看实际调用 →</button></div>${audit()}`}
function runView(run){return `<h2>本次返回的步骤状态</h2><div class="run-steps">${run.steps.map(s=>`<div class="run-step">${badge(s.status)}<div><b>${esc(s.id)}</b><br><small>${s.remoteRef?'remoteRef: '+esc(s.remoteRef):'尚无确认回执'}</small></div><div><small>固定请求 key</small><br><code>${esc(s.key)}</code></div></div>`).join('')}</div>`}
function stepPage(i){const s=steps[i],o=s.output;let visual='';if(s.method==='edit')visual=`<h2>编辑回执 · version ${o.version}</h2><div class="evidence">本批编辑已保存。preflightRequired = true：需要重新预检；若已有 Run，继续执行仍用 resume。完整当前意图由 preflight.preview 展示。</div>${codeBox('本批 changes · 按 OP 顺序',o.changes)}`;else if(o?.preview)visual=`<h2>本次 preview · version ${o.previewVersion??o.version}</h2>${graph(o.preview,o.diagnostics)}${issues(o.diagnostics)}${o.pendingRules?.length?codeBox("尚未完成的规则 · pendingRules",o.pendingRules):''}${o.steps?runView(o):''}`;else if(o?.nodes||o?.graph)visual=`<h2>返回的 Draft · version ${o.version}</h2>${graph(o)}`;else if(o?.steps)visual=runView(o);else if(s.method==='getRunInput')visual='<div class="evidence">这里返回该 Run 最新一次获准执行的 Draft、plan、certificate 和 binding。原始提交仍保留，历史请求见 Run.revisions。</div>';return `<div class="eyebrow">实际调用 ${String(i+1).padStart(2,'0')} / ${steps.length}</div><h1>${esc(s.method)} <span style="font-size:15px;vertical-align:middle">${badge(status(s))}</span></h1><p class="lead">${esc(s.note||labels[i])}</p><div class="facts"><span><b>${s.remoteCalls.length}</b>本步远端调用</span><span><b>${s.effectCount}</b>模拟资源总数</span>${o?.version!==undefined?`<span><b>${o.version}</b>Draft 版本</span>`:''}</div>${visual}<div class="section-head"><h2>实际输入与完整输出</h2><span class="meta">原始值，不省略字段；长内容可滚动</span></div><div class="io">${codeBox('INPUT · 参数按调用顺序',s.input)}${codeBox('OUTPUT · '+(s.method==='close'?'void 记作 null':'完整返回对象'),o)}</div><h2>本步异步规则查询</h2>${codeBox("单次查询的真实输入输出",s.checkCalls??[])}<h2>本步实际 Mock 调用</h2>${s.remoteCalls.length?s.remoteCalls.map((c,n)=>`<details open><summary>${n+1}. ${esc(c.method)} · ${esc(c.input.step.id)} ${c.threw?'· 远端生效后模拟丢响应':''}</summary>${codeBox('请求输入与实际结果',c)}</details>`).join(''):'<div class="empty">[] · 这一步没有调用 apply 或 reconcile。</div>'}<div class="page-actions"><button data-select="${i===0?'case':i-1}">← ${i===0?'完整现场':'上一步'}</button>${i<steps.length-1?`<button class="primary" data-select="${i+1}">下一步：${esc(steps[i+1].method)} →</button>`:'<button class="primary" data-select="case">回到全貌</button>'}</div>${audit()}`}
function render(value){selected=value;codeValues.clear();codeId=0;nav();document.getElementById('main').innerHTML=value==='case'?casePage():value==='registration'?registrationPage():stepPage(value);window.scrollTo(0,0)}
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),1800)}
async function copy(id){const value=codeValues.get(id);try{await navigator.clipboard.writeText(value);toast('已复制完整内容')}catch{const range=document.createRange();range.selectNodeContents(document.getElementById(id));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('已选中完整内容，请按 ⌘C / Ctrl+C')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(b){const v=b.dataset.select;render(/^\d+$/.test(v)?Number(v):v)}const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy)});
document.getElementById('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([json(trace)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='stagedwrite-actual-trace.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
render(0);
</script>
</body></html>
